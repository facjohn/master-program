<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>🍐 마진 마스터</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍐</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #FAFAFA;
  --card: #ffffff;
  --ink: #111111;
  --muted: #71717A;
  --border: #E4E4E7;
  --hair: #F4F4F5;
  --blue: #2a78d6;    /* 매출 */
  --teal: #1baf7a;    /* 찐마진 */
  --red: #DC2626;     /* 적자 텍스트 */
  --red-bar: #e34948; /* 적자 막대 */
  --purple: #4a3aa7;  /* 건수 */
}
html, body {
  font-family: -apple-system, 'Pretendard', BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'tnum';
  min-height: 100vh;
}
body { padding-bottom: env(safe-area-inset-bottom); font-size: 15px; line-height: 1.45; }
button { font-family: inherit; }

/* ─── 로그인 화면 ─── */
.login-screen {
  position: fixed; inset: 0;
  background: #111111;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  z-index: 100;
}
.login-card {
  background: #fff;
  border-radius: 24px;
  padding: 40px 32px;
  width: 100%; max-width: 400px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.5);
}
.login-logo {
  width: 76px; height: 76px;
  background: #111;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 44px;
  margin: 0 auto 18px;
}
.login-title { text-align: center; font-size: 22px; font-weight: 900; color: var(--ink); }
.login-subtitle { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 600; }
.login-input {
  width: 100%; margin-top: 26px;
  padding: 16px 20px;
  font-size: 26px; font-weight: 800;
  text-align: center; letter-spacing: 10px;
  border: 2px solid var(--border);
  border-radius: 14px;
  background: #FAFAFA;
  color: var(--ink);
  outline: none; transition: border-color 0.2s;
}
.login-input:focus { border-color: var(--ink); }
.login-input.error { border-color: var(--red); background: #FEF2F2; animation: shake 0.5s; }
.login-error { color: var(--red); font-size: 14px; font-weight: 700; text-align: center; margin-top: 10px; }
.login-btn {
  width: 100%; margin-top: 18px;
  padding: 17px;
  font-size: 16px; font-weight: 800;
  background: #111; color: #fff;
  border: none; border-radius: 14px;
  cursor: pointer;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}

/* ─── 헤더 ─── */
.header {
  background: #111;
  color: #fff;
  padding: 14px 18px;
  padding-top: calc(14px + env(safe-area-inset-top));
  position: sticky; top: 0; z-index: 10;
}
.header-row { display: flex; align-items: center; gap: 10px; }
.header-logo { font-size: 21px; }
.header h1 { font-size: 17px; font-weight: 900; letter-spacing: -0.3px; }
.header-status { margin-left: auto; font-size: 12px; opacity: 0.8; font-weight: 600; font-variant-numeric: tabular-nums; }
.refresh-btn {
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  color: #fff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}

/* ─── 시즌 탭 ─── */
.season-tabs {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.season-tabs::-webkit-scrollbar { display: none; }
.season-tabs:empty { display: none; }
.season-tab {
  padding: 9px 18px;
  background: var(--hair);
  border: 1.5px solid transparent;
  border-radius: 999px;
  font-size: 14px; font-weight: 800;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  flex: none;
}
.season-tab.active { background: #111; color: #fff; }

/* ─── 메인 ─── */
.main { padding: 14px 14px 4px; max-width: 640px; margin: 0 auto; width: 100%; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-title { font-size: 15px; font-weight: 900; color: var(--ink); }
.badge {
  font-size: 11px; font-weight: 700; color: var(--muted);
  background: var(--hair); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 10px;
}

/* KPI */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.kpi {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  min-width: 0;
}
.kpi-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.3px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.kpi-value { font-size: 24px; font-weight: 900; color: var(--ink); margin-top: 6px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-value.neg { color: var(--red); }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi-sub.neg { color: var(--red); }

/* 범례 */
.legend { display: flex; gap: 14px; margin-bottom: 10px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend-dot { width: 9px; height: 9px; border-radius: 3px; }

/* 월별 막대 행 */
.brow { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.brow-label { width: 36px; flex: none; font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.brow-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.bar-track { height: 9px; border-radius: 4px; background: var(--hair); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.brow-vals { flex: none; min-width: 80px; text-align: right; }
.v-sales { font-size: 13.5px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.v-margin { font-size: 12.5px; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
.v-margin.neg { color: var(--red); }
.v-zero { color: #C4C4C8; }

/* 그룹(품목/나라) 행 */
.grow { padding: 11px 0; border-bottom: 1px solid var(--hair); }
.grow:last-child { border-bottom: none; padding-bottom: 3px; }
.grow-head { display: flex; align-items: baseline; gap: 8px; }
.grow-name { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 800; color: var(--ink); overflow-wrap: anywhere; }
.grow-sales { font-size: 14.5px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.grow-bars { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.grow-sub { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.m-val { font-weight: 800; color: var(--teal); }
.m-val.neg { color: var(--red); }

/* TOP 바이어 */
.buyer-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.buyer-row:last-child { border-bottom: none; padding-bottom: 3px; }
.rank {
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--hair); color: var(--ink);
  font-size: 13px; font-weight: 900;
  display: flex; align-items: center; justify-content: center; flex: none;
}
.rank.top { background: #111; color: #fff; }
.buyer-mid { flex: 1; min-width: 0; }
.buyer-name { font-size: 14.5px; font-weight: 800; overflow-wrap: anywhere; }
.buyer-sub { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
.buyer-track { height: 5px; border-radius: 3px; background: var(--hair); margin-top: 6px; overflow: hidden; }
.buyer-bar { height: 100%; border-radius: 3px; }
.buyer-margin { flex: none; font-size: 14.5px; font-weight: 900; color: var(--teal); font-variant-numeric: tabular-nums; }
.buyer-margin.neg { color: var(--red); }

/* 회사 순이익 */
.sec-sub { font-size: 12px; color: var(--muted); font-weight: 600; margin: -6px 0 12px; line-height: 1.5; }
.profit-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.pchip { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; }
.pchip-label { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.3px; }
.pchip-value { font-size: 16px; font-weight: 900; margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pchip-value.minus { color: #52525B; }
.pchip-value.plus { color: var(--teal); }
.pchip-value.neg { color: var(--red); }
.cat-title { font-size: 12px; font-weight: 900; color: var(--muted); margin: 12px 0 6px; }
.cat-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-chip { display: flex; gap: 8px; align-items: baseline; background: #F4F4F5; border-radius: 9px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
.cat-chip .amt { font-weight: 900; font-variant-numeric: tabular-nums; }
.profit-card { border-radius: 14px; padding: 16px; margin-top: 12px; color: #fff; }
.profit-card.pos { background: linear-gradient(135deg, #000, #3F3F46); }
.profit-card.neg { background: linear-gradient(135deg, #B91C1C, #DC2626); }
.profit-card .pc-title { font-size: 12.5px; font-weight: 900; opacity: 0.92; }
.profit-card .pc-formula { font-size: 11px; font-weight: 600; opacity: 0.75; margin-top: 2px; }
.profit-card .pc-value { font-size: 26px; font-weight: 900; margin-top: 8px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.profit-card .pc-sub { font-size: 12px; font-weight: 700; opacity: 0.85; margin-top: 4px; }
.profit-note { background: #F4F4F5; border: 1.5px dashed #A1A1AA; border-radius: 12px; padding: 14px; font-size: 12.5px; font-weight: 600; color: #3F3F46; line-height: 1.7; }

/* 로딩/에러 */
.state { padding: 56px 20px; text-align: center; color: var(--muted); font-size: 14px; font-weight: 600; }
.state.error { color: var(--red); }
.state-icon { font-size: 28px; margin-bottom: 8px; }
.state-sub { margin-top: 8px; font-size: 12px; color: var(--muted); }
.spinner {
  width: 36px; height: 36px;
  border: 4px solid var(--border);
  border-top-color: #111;
  border-radius: 50%;
  margin: 0 auto 14px;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 푸터 */
.footer { max-width: 640px; margin: 0 auto; text-align: center; padding: 10px 20px 28px; }
.updated-at { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.footer-btns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.footer-btn {
  padding: 11px 22px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--ink);
  font-size: 14px; font-weight: 800;
  cursor: pointer;
}
.footer-btn.primary { background: #111; color: #fff; border-color: #111; }
.copyright { margin-top: 16px; font-size: 11px; color: #A1A1AA; font-weight: 600; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login" class="login-screen">
  <div class="login-card">
    <div class="login-logo">🍐</div>
    <div class="login-title">마진 계산 마스터</div>
    <div class="login-subtitle">현농프레쉬 모바일 대시보드</div>
    <input id="pwd" type="password" class="login-input" placeholder="••••" inputmode="numeric" maxlength="20" autofocus>
    <div id="login-error" class="login-error" style="display:none;">❌ 비밀번호가 틀렸어요</div>
    <button id="login-btn" class="login-btn" type="button">로그인 →</button>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app" style="display:none;">
  <header class="header">
    <div class="header-row">
      <span class="header-logo">🍐</span>
      <h1>마진 마스터</h1>
      <div class="header-status" id="header-status">─</div>
      <button id="refresh" class="refresh-btn" type="button">🔄</button>
    </div>
  </header>

  <div class="season-tabs" id="season-tabs"></div>

  <main class="main" id="content"></main>

  <footer class="footer">
    <div id="updated-at" class="updated-at">─</div>
    <div class="footer-btns">
      <button id="refresh-bottom" class="footer-btn primary" type="button">🔄 새로고침</button>
      <button id="lock-btn" class="footer-btn" type="button">🔒 잠그기</button>
    </div>
    <div class="copyright">© 2026 현농프레쉬 · 모바일 대시보드 v2.0</div>
  </footer>
</div>

<script>
'use strict';
// ════════════════════════════════════════════════════
// 설정
// ════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz2gUf5lC7ufwD8ACdcN2VPI7Yad3m1kyngG4du1bpiQAmwAynjpCIFAgo8hhScxgoG/exec';
const PASSWORD = '1004';

// 데스크톱 앱(sheets.ts)과 동일: 정산 완료된 마지막 시즌 — 이 시즌 이하 저장값은 그대로 신뢰
const SETTLED_SEASON_MAX = 2025;

// 차트 전용 유채색 (프레임은 블랙&화이트)
const C_SALES = '#2a78d6';   // 매출
const C_MARGIN = '#1baf7a';  // 찐마진
const C_LOSS_BAR = '#e34948';// 적자 막대
const C_COUNT = '#4a3aa7';   // 건수

// 과일 고유색 — 데스크톱 Dashboard.tsx와 동일
const PRODUCT_COLORS = {
  '배': '#eda100',
  '샤인머스캣': '#1baf7a',
  '단감': '#eb6834',
  '딸기': '#e87ba4',
  '키위': '#008300',
  '사과': '#2a78d6',
};
function productColor(name) {
  if (!name) return '#4a3aa7';
  if (PRODUCT_COLORS[name]) return PRODUCT_COLORS[name];
  const n = String(name).toLowerCase();
  if (n.includes('딸기') || n.includes('strawberry')) return '#e87ba4';
  if (n.includes('샤인') || n.includes('포도') || n.includes('grape') || n.includes('muscat')) return '#1baf7a';
  if (n.includes('사과') || n.includes('apple')) return '#2a78d6';
  if (n.includes('배') || n.includes('pear')) return '#eda100';
  if (n.includes('키위') || n.includes('kiwi')) return '#008300';
  if (n.includes('감') || n.includes('persimmon')) return '#eb6834';
  return '#4a3aa7';
}
function productEmoji(name) {
  const n = String(name || '').toLowerCase();
  if (/딸기|strawberry/.test(n)) return '🍓';
  if (/샤인|포도|grape|muscat/.test(n)) return '🍇';
  if (/사과|apple/.test(n)) return '🍎';
  if (/배|pear/.test(n)) return '🍐';
  if (/복숭아|peach/.test(n)) return '🍑';
  if (/감|persimmon/.test(n)) return '🟠';
  if (/귤|오렌지|orange|mandarin/.test(n)) return '🍊';
  if (/키위|kiwi/.test(n)) return '🥝';
  if (/멜론|참외|melon/.test(n)) return '🍈';
  if (/수박|watermelon/.test(n)) return '🍉';
  return '📦';
}

let txs = [];            // 정규화된 거래
let fixedCosts = {};     // 시즌별 고정비/지원금 (백엔드 fixedCosts)
let currentSeason = null;

// ════════════════════════════════════════════════════
// DOM 헬퍼 — 모든 동적 문자열은 textContent로만 삽입 (XSS 방지)
// ════════════════════════════════════════════════════
function h(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined && text !== null) el.textContent = text;
  return el;
}
function barTrack(color, widthPct, height) {
  const track = h('div', 'bar-track');
  if (height) track.style.height = height;
  const fill = h('div', 'bar-fill');
  fill.style.background = color;
  fill.style.width = widthPct;
  track.appendChild(fill);
  return track;
}
function barW(v, max) {
  if (!v || v <= 0 || !max || max <= 0) return '0%';
  return Math.min(100, Math.max(2, (v / max) * 100)) + '%';
}

// ════════════════════════════════════════════════════
// 숫자/날짜 유틸 — 데스크톱 sheets.ts 포팅
// ════════════════════════════════════════════════════
function num(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}
function serialToDate(n) {
  // Excel serial (30000~70000) → 'YYYY-MM-DD'
  if (!isFinite(n) || n < 30000 || n > 70000) return '';
  const d = new Date(Math.round((n - 25569) * 86400 * 1000));
  if (isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateStr(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'string') {
    const m = v.match(/(\d{4})[-/.]\s*(\d{1,2})[-/.]\s*(\d{1,2})/);
    if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
    if (/^\d+(\.\d+)?$/.test(v.trim())) return serialToDate(Number(v));
    return '';
  }
  if (typeof v === 'number') return serialToDate(v);
  return '';
}
// 시즌 = 7월~익년 6월, 라벨 = 시작 연도
function seasonOf(ds) {
  if (!ds) return null;
  const y = parseInt(ds.slice(0, 4), 10);
  const m = parseInt(ds.slice(5, 7), 10);
  if (!y || !m) return null;
  return m >= 7 ? y : y - 1;
}
// 인보이스 prefix → 바이어 코드 (데스크톱 extractBuyerCode와 동일)
function extractBuyerCode(invoiceNo) {
  if (!invoiceNo) return '';
  const s = String(invoiceNo).trim();
  const m = s.match(/^([A-Z&]+)/i);
  if (m) return m[1].toUpperCase();
  const dash = s.indexOf('-');
  return dash > 0 ? s.slice(0, dash).toUpperCase() : s.toUpperCase();
}
// 금액 축약: 54.9억 / 4,050만 / 3,500원
function fmtShort(n) {
  if (!n) return '0원';
  const abs = Math.abs(n);
  if (abs >= 1e8) return (n / 1e8).toFixed(1) + '억';
  if (abs >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '만';
  return Math.round(n).toLocaleString('ko-KR') + '원';
}
function fmtFull(n) {
  return Math.round(n || 0).toLocaleString('ko-KR') + '원';
}
function fmtPct(rate) {
  if (!isFinite(rate)) return '-';
  return (rate * 100).toFixed(1) + '%';
}

// ════════════════════════════════════════════════════
// 거래 정규화 — 데스크톱 rowsToTransactions와 같은 결과
// ════════════════════════════════════════════════════
function normalizeTx(r) {
  const shippingDate = dateStr(r.shippingDate);
  const season = seasonOf(shippingDate);
  const costMaterial = num(r.costMaterial);
  const costPacking = num(r.costPacking);
  const costInland = num(r.costInland);
  const costFreight = num(r.costFreight);
  const costOther = num(r.costOther);
  const costSum = costMaterial + costPacking + costInland + costFreight + costOther;

  // 폴백 ① 공급가액: 이번 시즌(2026~)부터 시트 수식 결손 행(공급가액 0)은 비용 합으로 계산.
  //   정산 완료 시즌(~2025)은 저장값 그대로 (과거 확정 숫자 불변).
  let supplyAmount = num(r.supplyAmount);
  if (season !== null && season > SETTLED_SEASON_MAX && supplyAmount === 0 && costSum > 0) {
    supplyAmount = costSum;
  }

  const actualReceivedKrw = num(r.actualReceivedKrw);

  // 폴백 ② 찐마진: 시트 값이 0인데 (매출-공급가액)과 다르면 수식 결손 행 → 계산값 사용
  let trueMargin = num(r.trueMargin);
  const calcMargin = actualReceivedKrw - supplyAmount;
  if (trueMargin === 0 && calcMargin !== 0) trueMargin = calcMargin;

  return {
    invoiceNo: String(r.invoiceNo || ''),
    shippingDate,
    season,
    year: shippingDate ? parseInt(shippingDate.slice(0, 4), 10) : 0,
    month: shippingDate ? parseInt(shippingDate.slice(5, 7), 10) : 0,
    country: String(r.country || ''),
    origin: String(r.origin || ''),
    product: String(r.product || ''),
    buyer: String(r.buyer || ''),
    costMaterial, costPacking, costInland, costFreight, costOther,
    supplyAmount, actualReceivedKrw, trueMargin,
    status: String(r.status || ''),
  };
}

// 미확정 거래 판단 — 데스크톱 isIncompleteTransaction과 동일
function isIncomplete(t) {
  const realCosts = (t.costMaterial || 0) + (t.costInland || 0) + (t.costFreight || 0) + (t.costOther || 0);
  if (realCosts === 0) return true;
  if (t.actualReceivedKrw > 0 && t.supplyAmount > 0 && t.supplyAmount / t.actualReceivedKrw < 0.1) return true;
  return false;
}

// 입금 전 거래 판단 — 데스크톱 isPendingDeposit과 동일.
// 비용은 입력됐는데 실입금이 0이면 찐마진이 -공급가액 허수가 되므로 집계에서 분리 (현재 시즌만).
// 정산 완료 시즌(~SETTLED_SEASON_MAX)은 저장값 그대로 신뢰.
function isPendingDeposit(t) {
  if (t.season === null || t.season <= SETTLED_SEASON_MAX) return false;
  return (t.actualReceivedKrw || 0) === 0 && (t.supplyAmount || 0) > 0;
}

// ════════════════════════════════════════════════════
// 로그인 / 잠그기
// ════════════════════════════════════════════════════
const pwdInput = document.getElementById('pwd');
const loginError = document.getElementById('login-error');
const contentEl = document.getElementById('content');

function tryLogin() {
  if (pwdInput.value.trim() === PASSWORD) {
    sessionStorage.setItem('mobAuthed', 'true');
    showApp();
  } else {
    loginError.style.display = 'block';
    pwdInput.classList.add('error');
    pwdInput.value = '';
    setTimeout(() => pwdInput.classList.remove('error'), 500);
    pwdInput.focus();
  }
}
document.getElementById('login-btn').addEventListener('click', tryLogin);
pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

document.getElementById('lock-btn').addEventListener('click', () => {
  sessionStorage.removeItem('mobAuthed');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  pwdInput.value = '';
  pwdInput.focus();
});
document.getElementById('refresh').addEventListener('click', loadData);
document.getElementById('refresh-bottom').addEventListener('click', () => {
  loadData();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadData();
}
if (sessionStorage.getItem('mobAuthed') === 'true') showApp();

// ════════════════════════════════════════════════════
// 데이터 로드
// ════════════════════════════════════════════════════
function showLoading() {
  contentEl.textContent = '';
  const box = h('div', 'state');
  box.appendChild(h('div', 'spinner'));
  box.appendChild(h('div', null, '데이터 불러오는 중...'));
  contentEl.appendChild(box);
}
function showError(msg) {
  contentEl.textContent = '';
  const box = h('div', 'state error');
  box.appendChild(h('div', 'state-icon', '❌'));
  box.appendChild(h('div', null, msg));
  box.appendChild(h('div', 'state-sub', '인터넷 확인 후 새로고침을 눌러주세요'));
  contentEl.appendChild(box);
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?pwd=' + PASSWORD);
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    txs = (data.txs || []).map(normalizeTx);
    fixedCosts = data.fixedCosts || {};

    const now = new Date();
    document.getElementById('header-status').textContent =
      txs.length + '건 · ' + now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('updated-at').textContent =
      '마지막 업데이트 ' + now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    renderSeasonTabs();
    renderDashboard();
  } catch (e) {
    showError(String(e && e.message ? e.message : e));
  }
}

// ════════════════════════════════════════════════════
// 시즌 탭 — 데이터에 존재하는 시즌만, 기본 = 최신
// ════════════════════════════════════════════════════
function renderSeasonTabs() {
  const set = new Set();
  txs.forEach(t => { if (t.season !== null) set.add(t.season); });
  const seasons = [...set].sort((a, b) => b - a);
  const tabsEl = document.getElementById('season-tabs');
  tabsEl.textContent = '';
  if (seasons.length === 0) { currentSeason = null; return; }
  if (currentSeason === null || !set.has(currentSeason)) currentSeason = seasons[0];

  seasons.forEach(y => {
    const b = h('button', 'season-tab' + (y === currentSeason ? ' active' : ''), y + '년 시즌');
    b.type = 'button';
    b.addEventListener('click', () => {
      if (currentSeason === y) return;
      currentSeason = y;
      renderSeasonTabs();
      renderDashboard();
    });
    tabsEl.appendChild(b);
  });
}

// ════════════════════════════════════════════════════
// 대시보드 렌더
// ════════════════════════════════════════════════════
function sectionCard(title) {
  const card = h('section', 'card');
  const head = h('div', 'sec-head');
  head.appendChild(h('h2', 'sec-title', title));
  card.appendChild(head);
  return card;
}
function legendRow(items) {
  const l = h('div', 'legend');
  items.forEach(([color, label]) => {
    const it = h('span', 'legend-item');
    const dot = h('span', 'legend-dot');
    dot.style.background = color;
    it.appendChild(dot);
    it.appendChild(document.createTextNode(label));
    l.appendChild(it);
  });
  return l;
}
function valueCol(sales, margin) {
  const vals = h('div', 'brow-vals');
  vals.appendChild(h('div', 'v-sales' + (sales === 0 ? ' v-zero' : ''), sales === 0 ? '–' : fmtShort(sales)));
  vals.appendChild(h('div', 'v-margin' + (margin < 0 ? ' neg' : '') + (margin === 0 ? ' v-zero' : ''), margin === 0 ? '–' : fmtShort(margin)));
  return vals;
}

function renderDashboard() {
  contentEl.textContent = '';
  if (currentSeason === null) {
    const box = h('div', 'state');
    box.appendChild(h('div', 'state-icon', '📭'));
    box.appendChild(h('div', null, '표시할 거래 데이터가 없습니다'));
    contentEl.appendChild(box);
    return;
  }

  const seasonAll = txs.filter(t => t.season === currentSeason);
  const seasonComplete = seasonAll.filter(t => !isIncomplete(t));
  const pendingTxs = seasonComplete.filter(t => isPendingDeposit(t)); // 입금 전 — 집계 분리
  const seasonTxs = seasonComplete.filter(t => !isPendingDeposit(t)); // KPI·차트 대상
  const excludedCount = seasonAll.length - seasonComplete.length;     // 미확정 제외 건수

  if (seasonAll.length === 0) {
    const box = h('div', 'state');
    box.appendChild(h('div', 'state-icon', '📭'));
    box.appendChild(h('div', null, '선택한 시즌 데이터 없음'));
    contentEl.appendChild(box);
    return;
  }

  // ── KPI 집계 (데스크톱 Dashboard.tsx와 동일 규칙) ──
  const sales = seasonTxs.reduce((s, t) => s + t.actualReceivedKrw, 0);
  const margin = seasonTxs.reduce((s, t) => s + t.trueMargin, 0);
  const rate = sales > 0 ? margin / sales : 0;   // 마진율 = 찐마진 / 매출
  const lossTxs = seasonTxs.filter(t => t.trueMargin < 0 && t.actualReceivedKrw > 0);

  // ── ① KPI 2×2 ──
  const kpiSec = h('div');
  const kpiHead = h('div', 'sec-head');
  kpiHead.appendChild(h('h2', 'sec-title', '📊 ' + currentSeason + '년 시즌 (' + currentSeason + '.07 ~ ' + (currentSeason + 1) + '.06)'));
  if (excludedCount > 0) kpiHead.appendChild(h('span', 'badge', '미확정 ' + excludedCount + '건 제외'));
  if (pendingTxs.length > 0) kpiHead.appendChild(h('span', 'badge', '입금 전 ' + pendingTxs.length + '건 분리'));
  kpiSec.appendChild(kpiHead);

  const grid = h('div', 'kpi-grid');
  grid.appendChild(kpiCard('매출', C_SALES, fmtShort(sales), fmtFull(sales), false));
  grid.appendChild(kpiCard('찐마진', margin < 0 ? C_LOSS_BAR : C_MARGIN, fmtShort(margin), fmtFull(margin), margin < 0));
  grid.appendChild(kpiCard('마진율', C_MARGIN, fmtPct(rate), '찐마진 ÷ 매출', rate < 0));
  const cntCard = kpiCard('거래 건수', C_COUNT, seasonTxs.length + '건', lossTxs.length > 0 ? '적자 ' + lossTxs.length + '건' : '적자 없음', false);
  if (lossTxs.length > 0) cntCard.querySelector('.kpi-sub').classList.add('neg');
  grid.appendChild(cntCard);
  kpiSec.appendChild(grid);
  contentEl.appendChild(kpiSec);

  // ── ② 월별 매출·찐마진 (7월 → 익년 6월) ──
  const MONTHS = [[7,0],[8,0],[9,0],[10,0],[11,0],[12,0],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]];
  const monthly = MONTHS.map(([m, off]) => {
    const y = currentSeason + off;
    const mt = seasonTxs.filter(t => t.year === y && t.month === m);
    return {
      label: m + '월',
      sales: mt.reduce((s, t) => s + t.actualReceivedKrw, 0),
      margin: mt.reduce((s, t) => s + t.trueMargin, 0),
    };
  });
  const mMax = Math.max(...monthly.map(r => Math.max(r.sales, Math.abs(r.margin))), 0);
  const mCard = sectionCard('📈 월별 매출 · 찐마진');
  mCard.appendChild(legendRow([[C_SALES, '매출'], [C_MARGIN, '찐마진'], [C_LOSS_BAR, '적자']]));
  monthly.forEach(r => {
    const row = h('div', 'brow');
    row.appendChild(h('div', 'brow-label', r.label));
    const bars = h('div', 'brow-bars');
    bars.appendChild(barTrack(C_SALES, barW(r.sales, mMax)));
    bars.appendChild(barTrack(r.margin < 0 ? C_LOSS_BAR : C_MARGIN, barW(Math.abs(r.margin), mMax)));
    row.appendChild(bars);
    row.appendChild(valueCol(r.sales, r.margin));
    mCard.appendChild(row);
  });
  contentEl.appendChild(mCard);

  // ── 그룹 집계 헬퍼 (데스크톱 groupBy와 동일 규칙) ──
  function groupRows(keyFn) {
    const map = new Map();
    seasonTxs.forEach(t => {
      const key = keyFn(t);
      if (!key) return;
      const cur = map.get(key) || { name: key, sales: 0, margin: 0, count: 0 };
      cur.sales += t.actualReceivedKrw;
      cur.margin += t.trueMargin;
      cur.count += 1;
      map.set(key, cur);
    });
    return [...map.values()].sort((a, b) => b.sales - a.sales);
  }

  // ── ③ 품목별 매출 & 찐마진 ──
  const byProduct = groupRows(t => String(t.product || '').trim());
  if (byProduct.length > 0) {
    const pMax = Math.max(...byProduct.map(g => Math.max(g.sales, Math.abs(g.margin))), 0);
    const pCard = sectionCard('🍐 품목별 매출 & 찐마진');
    byProduct.forEach(g => {
      pCard.appendChild(groupRow(productEmoji(g.name) + ' ' + g.name, g, pMax, productColor(g.name)));
    });
    contentEl.appendChild(pCard);
  }

  // ── ④ 나라별 매출 & 찐마진 ──
  const byCountry = groupRows(t => {
    const k = String(t.country || '').trim();
    if (!k) return '';
    return k.split('(')[0];   // 괄호 제거 후 그룹화 (데스크톱과 동일)
  });
  if (byCountry.length > 0) {
    const cMax = Math.max(...byCountry.map(g => Math.max(g.sales, Math.abs(g.margin))), 0);
    const cCard = sectionCard('🌏 나라별 매출 & 찐마진');
    byCountry.forEach(g => {
      cCard.appendChild(groupRow('🌏 ' + g.name, g, cMax, C_SALES));
    });
    contentEl.appendChild(cCard);
  }

  // ── ⑤ TOP 바이어 (찐마진순 TOP 10) ──
  const byBuyer = groupRows(t => extractBuyerCode(t.invoiceNo) || String(t.buyer || '기타').trim())
    .sort((a, b) => b.margin - a.margin)
    .slice(0, 10);
  if (byBuyer.length > 0) {
    const bMax = Math.max(...byBuyer.map(g => Math.abs(g.margin)), 0);
    const bCard = sectionCard('🏆 TOP 바이어 — 찐마진순');
    byBuyer.forEach((g, i) => {
      const row = h('div', 'buyer-row');
      row.appendChild(h('div', 'rank' + (i < 3 ? ' top' : ''), String(i + 1)));
      const mid = h('div', 'buyer-mid');
      mid.appendChild(h('div', 'buyer-name', g.name));
      mid.appendChild(h('div', 'buyer-sub', g.count + '건 · 매출 ' + fmtShort(g.sales)));
      const track = h('div', 'buyer-track');
      const fill = h('div', 'buyer-bar');
      fill.style.background = g.margin < 0 ? C_LOSS_BAR : C_MARGIN;
      fill.style.width = barW(Math.abs(g.margin), bMax);
      track.appendChild(fill);
      mid.appendChild(track);
      row.appendChild(mid);
      row.appendChild(h('div', 'buyer-margin' + (g.margin < 0 ? ' neg' : ''), fmtShort(g.margin)));
      bCard.appendChild(row);
    });
    contentEl.appendChild(bCard);
  }

  // ── ⑥ 회사 순이익 — 데스크톱 '회사 순이익' 섹션과 동일 공식 ──
  //    순이익 = 총매출 − 총매입 − 고정비 / 현실 이익 = + 정부지원금
  const supply = seasonTxs.reduce((s, t) => s + t.supplyAmount, 0);
  const fCard = sectionCard('🏢 회사 순이익');
  fCard.appendChild(h('div', 'sec-sub', '찐마진에서 고정비(인건비/임대료 등)를 차감한 실제 회사 이익'));

  const fx = fixedCosts[String(currentSeason)];
  // 새 백엔드(A~Z 매핑) 여부 판별 — 옛 백엔드는 '공과금' 키가 없어 새 카테고리(Q~Z) 값이 빠짐
  const fxReady = fx && fx.fixed && Object.prototype.hasOwnProperty.call(fx.fixed, '공과금');
  if (!fxReady) {
    const note = h('div', 'profit-note');
    note.appendChild(h('div', null, '고정비 데이터를 불러오려면 백엔드(Apps Script) 업데이트가 1회 필요합니다.'));
    note.appendChild(h('div', null, 'PC의 margin-program/mobile 폴더 안내에 따라 재배포하면 이 자리에 회사 순이익이 표시됩니다.'));
    fCard.appendChild(note);
  } else {
    const fixedTotal = Object.values(fx.fixed).reduce((s, v) => s + num(v), 0);
    const incomeTotal = Object.values(fx.income || {}).reduce((s, v) => s + num(v), 0);
    const netProfit = margin - fixedTotal;                 // 총매출 − 총매입 − 고정비 (= 찐마진 − 고정비)
    const realProfit = netProfit + incomeTotal;            // + 정부지원금

    const chips = h('div', 'profit-chips');
    const chip = (label, value, cls) => {
      const c = h('div', 'pchip');
      c.appendChild(h('div', 'pchip-label', label));
      c.appendChild(h('div', 'pchip-value' + (cls ? ' ' + cls : ''), value));
      return c;
    };
    chips.appendChild(chip('💵 총 매출', fmtFull(sales)));
    chips.appendChild(chip('📦 매입 (공급가액)', '− ' + fmtFull(supply), 'minus'));
    chips.appendChild(chip('⭐ 찐마진', fmtFull(margin), margin < 0 ? 'neg' : ''));
    chips.appendChild(chip('🧾 고정비', '− ' + fmtFull(fixedTotal), 'minus'));
    if (incomeTotal > 0) chips.appendChild(chip('🎁 정부지원금', '+ ' + fmtFull(incomeTotal), 'plus'));
    fCard.appendChild(chips);

    // 고정비 카테고리 (0원 제외)
    const fixedEntries = Object.entries(fx.fixed).filter(([, v]) => num(v) > 0).sort((a, b) => num(b[1]) - num(a[1]));
    if (fixedEntries.length > 0) {
      fCard.appendChild(h('div', 'cat-title', '📋 고정비 (' + currentSeason + '년 시즌)'));
      const cg = h('div', 'cat-grid');
      fixedEntries.forEach(([name, v]) => {
        const c = h('span', 'cat-chip');
        c.appendChild(h('span', null, name));
        c.appendChild(h('span', 'amt', fmtFull(num(v))));
        cg.appendChild(c);
      });
      fCard.appendChild(cg);
    }
    // 지원금 카테고리 (0원 제외)
    const incEntries = Object.entries(fx.income || {}).filter(([, v]) => num(v) > 0).sort((a, b) => num(b[1]) - num(a[1]));
    if (incEntries.length > 0) {
      fCard.appendChild(h('div', 'cat-title', '🎁 정부지원금 (' + currentSeason + '년 시즌)'));
      const ig = h('div', 'cat-grid');
      incEntries.forEach(([name, v]) => {
        const c = h('span', 'cat-chip');
        c.appendChild(h('span', null, name));
        c.appendChild(h('span', 'amt', '+' + fmtFull(num(v))));
        ig.appendChild(c);
      });
      fCard.appendChild(ig);
    }

    const resultCard = (title, formula, value, rate, extra) => {
      const card = h('div', 'profit-card ' + (value < 0 ? 'neg' : 'pos'));
      card.appendChild(h('div', 'pc-title', title));
      card.appendChild(h('div', 'pc-formula', formula));
      card.appendChild(h('div', 'pc-value', fmtFull(value)));
      card.appendChild(h('div', 'pc-sub', '순이익률 ' + (sales > 0 ? fmtPct(rate) : '-') + (extra ? '  ' + extra : '')));
      return card;
    };
    fCard.appendChild(resultCard(
      '📌 ' + currentSeason + '년 시즌 · 회사 순이익', '총매출 − 총매입 − 고정비',
      netProfit, sales > 0 ? netProfit / sales : 0));
    fCard.appendChild(resultCard(
      '🌍 ' + currentSeason + '년 시즌 · 현실 회사 이익', '총매출 + 정부지원금 − 총매입 − 고정비',
      realProfit, sales > 0 ? realProfit / sales : 0,
      incomeTotal > 0 ? '(지원금 +' + fmtFull(incomeTotal) + ')' : ''));
  }
  contentEl.appendChild(fCard);
}

function kpiCard(label, dotColor, value, sub, isNeg) {
  const card = h('div', 'kpi');
  const lab = h('div', 'kpi-label');
  const dot = h('span', 'dot');
  dot.style.background = dotColor;
  lab.appendChild(dot);
  lab.appendChild(document.createTextNode(label));
  card.appendChild(lab);
  card.appendChild(h('div', 'kpi-value' + (isNeg ? ' neg' : ''), value));
  card.appendChild(h('div', 'kpi-sub', sub));
  return card;
}

// 품목/나라 공용 행: 이름 + 매출액(우측) + 매출/찐마진 병렬 막대 + 서브(찐마진·마진율)
function groupRow(displayName, g, max, salesColor) {
  const row = h('div', 'grow');
  const head = h('div', 'grow-head');
  head.appendChild(h('div', 'grow-name', displayName));
  head.appendChild(h('div', 'grow-sales', fmtShort(g.sales)));
  row.appendChild(head);
  const bars = h('div', 'grow-bars');
  bars.appendChild(barTrack(salesColor, barW(g.sales, max)));
  bars.appendChild(barTrack(g.margin < 0 ? C_LOSS_BAR : C_MARGIN, barW(Math.abs(g.margin), max), '6px'));
  row.appendChild(bars);
  const sub = h('div', 'grow-sub');
  const left = h('span');
  left.appendChild(document.createTextNode('찐마진 '));
  left.appendChild(h('span', 'm-val' + (g.margin < 0 ? ' neg' : ''), fmtShort(g.margin)));
  sub.appendChild(left);
  const rateTxt = g.sales > 0
    ? '마진율 ' + fmtPct(g.margin / g.sales) + ' · ' + g.count + '건'
    : g.count + '건';
  sub.appendChild(h('span', null, rateTxt));
  row.appendChild(sub);
  return row;
}
</script>
</body>
</html>
